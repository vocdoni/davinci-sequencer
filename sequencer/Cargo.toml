[package]
name = "davinci-sequencer"
description = "DAVINCI sequencer node on the davinci-zkvm prover"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "davinci-sequencer"
path = "src/main.rs"

[dependencies]
axum.workspace = true
arbo.workspace = true
davinci-state.workspace = true
davinci-client.workspace = true
davinci-zkvm-sdk.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
redb.workspace = true
hex.workspace = true
rand.workspace = true
reqwest.workspace = true
url.workspace = true
async-trait.workspace = true
zeroize.workspace = true
hmac.workspace = true
sha2.workspace = true
num-bigint.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
tower = { workspace = true }
# The accept loop (`api::serve`): axum 0.7's own has no read-head timeout.
# HTTP/1 only, as axum's was.
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-graceful", "service"] }
# The node binary's allocator (`main.rs`): glibc keeps each thread arena's
# high-water mark, jemalloc returns freed pages from background threads.
tikv-jemallocator = { version = "0.7", features = ["background_threads"] }
alloy = { workspace = true, features = [
    "std",
    "trie",
    "rlp",
    "contract",
    "provider-http",
    "rpc-types",
    "signer-local",
    "network",
    "consensus",
    "eips",
    "kzg",
    "sol-types",
    "json",
    "json-abi",
    "json-rpc",
    "reqwest",
    "reqwest-rustls-tls",
] }

[features]
# Fault-injection hooks for the integration tests; never in a release build.
test-hooks = []

[dev-dependencies]
davinci-sequencer = { path = ".", features = ["test-hooks"] }
# start_paused backoff tests
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
k256.workspace = true
# Real circom ballot proofs for the API tests (cached under tests/cache).
davinci-client = { workspace = true, features = ["prover"] }
# RUST_LOG-driven subscriber for the test harness (see common::logs).
tracing-subscriber.workspace = true
alloy = { workspace = true, features = ["node-bindings"] }
# The `--db-cache-mb` test reads the page cache size.
redb = { workspace = true, features = ["cache_metrics"] }
# The memory soak reads the allocator's live bytes.
tikv-jemalloc-ctl = { version = "0.7", features = ["stats"] }
