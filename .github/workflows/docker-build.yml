name: Docker

on:
  workflow_call:
    inputs:
      image-tag:
        required: true
        type: string
      push:
        required: false
        type: boolean
        default: false

jobs:
  docker:
    name: ${{ inputs.push && 'Build and Publish' || 'Build' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # The workspace path-depends on ../davinci-zkvm, so the build context
      # is the parent of both checkouts. Same ref as ZKVM_REF in main.yml.
      - uses: actions/checkout@v6
        with:
          path: davinci-sequencer
      - uses: actions/checkout@v6
        with:
          repository: vocdoni/davinci-zkvm
          ref: main
          path: davinci-zkvm

      - name: Log in to Docker Hub
        if: ${{ inputs.push }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare vars
        id: vars
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image-tag }}
        run: echo "IMAGE_TAG_CLEAN=${IMAGE_TAG//\//-}" >> "$GITHUB_OUTPUT"

      - name:  ${{ inputs.push && 'Build and Publish' || 'Build' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: davinci-sequencer/Dockerfile
          push: ${{ inputs.push }}
          tags: |
            vocdoni/davinci-sequencer:${{ steps.vars.outputs.IMAGE_TAG_CLEAN }}
            ghcr.io/vocdoni/davinci-sequencer:${{ steps.vars.outputs.IMAGE_TAG_CLEAN }}
