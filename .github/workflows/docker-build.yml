name: Docker

# Builds the node image and optionally publishes it to Docker Hub and GHCR
# under `image-tag` (the branch or tag name). A release tag (v1.2.3) is also
# published as `latest`, which Watchtower deployments follow; prereleases
# (v1.2.3-rc1) are not.

on:
  workflow_call:
    inputs:
      image-tag:
        required: true
        type: string
      push:
        required: false
        type: boolean
        default: false

jobs:
  docker:
    name: ${{ inputs.push && 'Build and Publish' || 'Build' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # The workspace path-depends on ../davinci-zkvm, so the build context
      # is the parent of both checkouts. Same ref as ZKVM_REF in main.yml.
      - uses: actions/checkout@v6
        with:
          path: davinci-sequencer
      - uses: actions/checkout@v6
        with:
          repository: vocdoni/davinci-zkvm
          ref: main
          path: davinci-zkvm

      - name: Log in to Docker Hub
        if: ${{ inputs.push }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compose tag list
        id: tags
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image-tag }}
        run: |
          # Refs with slashes (feature/foo) are not valid Docker tags.
          primary=${IMAGE_TAG//\//-}
          tags="vocdoni/davinci-sequencer:${primary}"
          tags+=$'\n'"ghcr.io/vocdoni/davinci-sequencer:${primary}"
          if [[ "${primary}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            tags+=$'\n'"vocdoni/davinci-sequencer:latest"
            tags+=$'\n'"ghcr.io/vocdoni/davinci-sequencer:latest"
          fi
          {
            echo 'list<<EOF'
            echo "${tags}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name:  ${{ inputs.push && 'Build and Publish' || 'Build' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: davinci-sequencer/Dockerfile
          push: ${{ inputs.push }}
          tags: ${{ steps.tags.outputs.list }}
