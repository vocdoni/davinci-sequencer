[package]
name = "l1blob-driver"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
alloy = { version = "2.5", default-features = false, features = [
    "std", "consensus", "eips", "kzg", "network", "rpc-types", "signer-local", "k256",
    "provider-http", "sol-types", "json-rpc", "reqwest", "reqwest-rustls-tls",
] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
anyhow = "1"
